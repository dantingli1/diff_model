data_cfg:
  dataset_name: Gait3D
  dataset_root: /mnt/home/lidanting/gait/dataall/gait3d_sil_64_64_pkl
  dataset_partition: ./datasets/Gait3D/Gait3D.json
  num_workers: 4
  remove_no_gallery: false # Remove probe if no gallery for it
  test_dataset_name: Gait3D

evaluator_cfg:
  enable_float16: true
  restore_ckpt_strict: true
  restore_hint: 120000
  save_name: GLGaitBase_ori_gait3d
  eval_func: evaluate_Gait3D
  sampler:
    batch_shuffle: false
    batch_size: 1
    sample_type: all_ordered # all indicates whole sequence used to test, while ordered means input sequence by its natural order; Other options:   fixed_unordered
    frames_all_limit: 720 # limit the number of sampled frames to prevent out of memory
  metric: euc # cos
  transform:
    - type: BaseSilCuttingTransform

loss_cfg:
  - loss_term_weight: 1.0
    margin: 0.2
    type: TripletLoss
    log_prefix: triplet
  - loss_term_weight: 1.0
    margin: 0.2
    start: 30000
    type: CTL
    log_prefix: ctl
  - loss_term_weight: 1.0
    scale: 16
    type: CrossEntropyLoss
    log_prefix: softmax
    log_accuracy: true
  


model_cfg:
  model: Baseline_trans
  backbone_cfg:
    type: GLGait
    block: BasicBlock
    channels: # Layers configuration for automatically model construction
      - 64
      - 128
      - 256
      - 512
    layers:
      - 1
      - 4
      - 4
      - 1
    strides:
      - 1
      - 2
      - 2
      - 1
    maxpool: false
  SeparateFCs:
    in_channels: 512
    out_channels: 256
    parts_num: 16
  SeparateBNNecks:
    class_num: 3000
    in_channels: 256
    parts_num: 16
  bin_num:
    - 16

  # ★ 差分融合配置 (yaml 驱动 Baseline_trans)
  diff_ks: [1, 2, 3]        # 差分间隔
  diff_fuse: concat         # 拼接模式: cat(C,C) → DiffAttn(2C) → Conv(2C→C) → 残差
  use_attn: true            # 差分注意力开

  # ★ TDV 下一帧预测损失 (yaml 驱动 Baseline_trans)
  use_tdv: false            # 关闭；开启后加入 z_{t+1} ≈ z_t + MotionEncoder(z_{t+1} - z_t) 约束
  tdv_weight: 0.1           # TDV 损失在总 loss 中的权重
  tdv_use_motion_proj: true # True=1x1x1 Conv 学 motion; False=直接用特征差


optimizer_cfg:
  lr: 0.1
  momentum: 0.9
  solver: SGD
  weight_decay: 0.0005

scheduler_cfg:
  gamma: 0.1
  milestones: # Learning Rate Reduction at each milestones
    - 40000
    - 80000
    - 100000
  scheduler: MultiStepLR

trainer_cfg:
  enable_float16: true # half_percesion float for memory reduction and speedup
  fix_BN: false
  with_test: true
  log_iter: 100
  restore_ckpt_strict: true
  restore_hint: 0
  save_iter: 40000
  save_name: GLGaitBase_ori_gait3d
  sync_BN: false  #单卡false, 多卡true
  total_iter: 120000
  sampler:
    batch_shuffle: true   
    batch_size:
      - 8 # TripletSampler, batch_size[0] indicates Number of Identity
      - 4 #                 batch_size[1] indicates Samples sequqnce for each Identity
    frames_num_fixed: 30 # fixed frames number for training
    frames_num_max: 40 # max frames number for unfixed training
    frames_num_min: 20 # min frames number for unfixed traing
    frames_skip_num: 0
    sample_type: fixed_ordered # fixed control input frames number, unordered for controlling order of input tensor; Other options: unfixed_ordered or all_ordered
    type: TripletSampler
  transform:
    - type: Compose
      trf_cfg:
        - type: RandomPerspective
          prob: 0.2
        - type: BaseSilCuttingTransform
        - type: RandomHorizontalFlip
          prob: 0.2
        - type: RandomRotate
          prob: 0.2
