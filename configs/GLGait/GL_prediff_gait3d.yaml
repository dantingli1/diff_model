data_cfg:
  dataset_name: Gait3D
  dataset_root: your_path/gait3d_sil_64_64_pkl
  dataset_partition: ./datasets/Gait3D/Gait3D.json
  num_workers: 4
  remove_no_gallery: false
  test_dataset_name: Gait3D
  cache: false
  data_in_use: [true, false, false, false, false, false, false]

evaluator_cfg:
  enable_float16: true
  restore_ckpt_strict: true
  restore_hint: 120000
  save_name: GL_prediff_gait3d
  eval_func: evaluate_Gait3D
  sampler:
    batch_shuffle: false
    batch_size: 1
    sample_type: all_ordered
    frames_all_limit: 720
  metric: euc
  transform:
    - type: BaseSilCuttingTransform

loss_cfg:
  - loss_term_weight: 1.0
    margin: 0.2
    type: TripletLoss
    log_prefix: triplet
  - loss_term_weight: 1.0
    margin: 0.2
    start: 30000
    type: CTL
    log_prefix: ctl
  - loss_term_weight: 1.0
    scale: 16
    type: CrossEntropyLoss
    log_prefix: softmax
    log_accuracy: true

model_cfg:
  model: GL_prediff_Model
  backbone_cfg:
    type: GL_prediff                       # 仅日志使用，model.build_network 会忽略

    # ---- 主干基础结构 ----
    channels: [64, 128, 256, 512]
    layers: [1, 4, 4, 1]
    strides: [1, 2, 2, 1]
    maxpool: false
    in_channel: 1

    # ---- ★ 三个可配置开关 + 注意力超参 ----
    use_temporal_diff: true                # 多路时序差分 (TemporalDifference)
    use_diff_attention: true               # 差分注意力 (DifferentialAttention)
    diff_ks: [1, 2, 3]                     # 差分间隔：可写 [1] / [2] / [3] / [1,2] / [1,2,3]
    diff_attn_heads: 4                     # 差分注意力头数
    lambda_init: 0.5                       # 差分注意力 λ 初值

  SeparateFCs:
    in_channels: 512
    out_channels: 256
    parts_num: 16
  SeparateBNNecks:
    class_num: 3000                        # ★ Gait3D 类别数
    in_channels: 256
    parts_num: 16
  bin_num: [16]

  # ★ TDV 下一帧预测损失 (yaml 驱动 GL_prediff_Model)
  use_tdv: false            # 关闭；开启后加入 z_{t+1} ≈ z_t + MotionEncoder(z_{t+1} - z_t) 约束
  tdv_weight: 0.1           # TDV 损失在总 loss 中的权重
  tdv_use_motion_proj: true # True=1x1x1 Conv 学 motion; False=直接用特征差

optimizer_cfg:
  lr: 0.1
  momentum: 0.9
  solver: SGD
  weight_decay: 0.0005

scheduler_cfg:
  gamma: 0.1
  milestones: [40000, 80000, 100000]
  scheduler: MultiStepLR

trainer_cfg:
  enable_float16: true
  fix_BN: false
  with_test: true
  log_iter: 100
  restore_ckpt_strict: true
  restore_hint: 0
  save_iter: 40000
  save_name: GL_prediff_gait3d
  sync_BN: false
  total_iter: 120000
  find_unused_parameters: false
  sampler:
    batch_shuffle: true
    batch_size:
      - 8                                 # Number of Identity
      - 4                                 # Samples sequence for each Identity
    frames_num_fixed: 30
    frames_num_max: 40
    frames_num_min: 20
    frames_skip_num: 0
    sample_type: fixed_ordered
    type: TripletSampler
  transform:
    - type: Compose
      trf_cfg:
        - type: RandomPerspective
          prob: 0.2
        - type: BaseSilCuttingTransform
        - type: RandomHorizontalFlip
          prob: 0.2
        - type: RandomRotate
          prob: 0.2