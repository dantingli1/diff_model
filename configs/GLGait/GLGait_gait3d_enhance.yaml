data_cfg:
  dataset_name: Gait3D
  #dataset_root: /mnt/home/lidanting/gait/dataall/gait3d_sil_64_64_pkl
  dataset_root: /data0/lidanting/projection/dataall/gait3d-sil
  dataset_partition: ./datasets/Gait3D/Gait3D.json
  num_workers: 16
  remove_no_gallery: false # Remove probe if no gallery for it
  test_dataset_name: Gait3D

evaluator_cfg:
  enable_float16: true
  restore_ckpt_strict: true
  restore_hint: 120000
  #save_name: GLGaitBase_enhance_gait3d_diff2
  save_name: GLGaitBase_enhance_gait3d_diff1_atten_tdv_truefalse
  eval_func: evaluate_Gait3D
  sampler:
    batch_shuffle: false
    batch_size: 4
    sample_type: all_ordered # all indicates whole sequence used to test, while ordered means input sequence by its natural order; Other options:   fixed_unordered
    frames_all_limit: 720 # limit the number of sampled frames to prevent out of memory
  metric: euc # cos
  transform:
    - type: BaseSilCuttingTransform

loss_cfg:
  - loss_term_weight: 1.0
    margin: 0.2
    type: TripletLoss
    log_prefix: triplet
  - loss_term_weight: 1.0
    margin: 0.2
    start: 30000
    type: CTL
    log_prefix: ctl
  - loss_term_weight: 1.0
    scale: 16
    type: CrossEntropyLoss
    log_prefix: softmax
    log_accuracy: true
  


model_cfg:
  model: Baseline_trans
  backbone_cfg:
    type: GLGait
    block: BasicBlock
    channels: # Layers configuration for automatically model construction
      - 64
      - 128
      - 256
      - 512
    layers:
      - 1
      - 4
      - 4
      - 1
    strides:
      - 1
      - 2
      - 2
      - 1
    maxpool: false
  SeparateFCs:
    in_channels: 512
    out_channels: 256
    parts_num: 16
  SeparateBNNecks:
    class_num: 3000
    in_channels: 256
    parts_num: 16
  bin_num:
    - 16

  # ★ 差分融合配置 (yaml 驱动 Baseline_trans)
  diff_ks: [1]           # 仅双路差分 (对比 [1,2,3] 的消融)
  diff_fuse: residual       # 残差相加
  use_attn: true            # 差分注意力开

  # ★ TDV 下一帧预测损失 (yaml 驱动 Baseline_trans)
  use_tdv: true            # 关闭；开启后加入 z_{t+1} ≈ z_t + MotionEncoder(z_{t+1} - z_t) 约束
  #tdv_weight: 0.01           # TDV 损失在总 loss 中的权重 ==========【改动】0.1 → 0.01，降低时序预测损失权重！原先0.1偏大
  tdv_weight: 1       # ==========【改动】0.1 → 0.01，降低时序预测损失权重！原先0.1偏大 
  tdv_use_motion_proj: false # True=1x1x1 Conv 学 motion; False=直接用特征差
  #true true带可学习 motion_proj 的时序正则
  #true false直接用原始帧差分做预测，无运动投影层
  # feat_diff = x[:, :, 1:] - x[:, :, :-1]   # 第一步：原始特征帧间相减（得到原始运动差）
  # motion = self.motion_proj(feat_diff)     # 第二步：运动投影层，对差分做可学习变换
  # z_pred = x[:, :, :-1] + motion           # 当前帧 + 变换后的运动，预测下一帧


optimizer_cfg:
  #lr: 0.1
  lr: 0.05               # ==========【改动】0.1 →0.05，SGD学习率减半！新增模块不能用原始大lr
  momentum: 0.9
  
  solver: SGD
  weight_decay: 0.0005

scheduler_cfg:
  gamma: 0.1
  milestones: # Learning Rate Reduction at each milestones
    - 40000
    - 80000
    - 100000
  scheduler: MultiStepLR

trainer_cfg:
  enable_float16: true # half_percesion float for memory reduction and speedup
  fix_BN: false
  with_test: true
  log_iter: 100
  restore_ckpt_strict: true
  restore_hint: 0
  save_iter: 10000
  save_name: GLGaitBase_enhance_gait3d_diff1_atten_tdv_truefalse
  #save_name: GLGaitBase_enhance_gait3d_diff1
  sync_BN: true  #单卡false, 多卡true
  total_iter: 120000
  sampler:
    batch_shuffle: true   
    batch_size:
      - 8 # TripletSampler, batch_size[0] indicates Number of Identity
      - 4 #                 batch_size[1] indicates Samples sequqnce for each Identity
    frames_num_fixed: 30 # fixed frames number for training
    frames_num_max: 40 # max frames number for unfixed training
    frames_num_min: 20 # min frames number for unfixed traing
    frames_skip_num: 0
    sample_type: fixed_ordered # fixed control input frames number, unordered for controlling order of input tensor; Other options: unfixed_ordered or all_ordered
    type: TripletSampler
  transform:
    - type: Compose
      trf_cfg:
        - type: RandomPerspective
          prob: 0.2
        - type: BaseSilCuttingTransform
        - type: RandomHorizontalFlip
          prob: 0.2
        - type: RandomRotate
          prob: 0.2
        - type: BaseParsingCuttingTransform
        - type: RandomHorizontalFlip
          p: 0.2
        - type: RandomRotate
          p: 0.2

